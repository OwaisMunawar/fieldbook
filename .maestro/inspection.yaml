- tapOn: "Scan sample card"
- assertVisible: "Review evidence"
- scrollUntilVisible:
    element: "Handrail loose at north stair."
- tapOn: "Handrail loose at north stair."
- scrollUntilVisible:
    element: "Accept reviewed action"
- tapOn: "Accept reviewed action"
