version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      - dependency-name: flutter
      - dependency-name: flutter_test
      - dependency-name: integration_test
      - dependency-name: flutter_lints
      # Riverpod 3.5 pulls packages that do not resolve on Flutter 3.44.
      - dependency-name: flutter_riverpod
        update-types: ['version-update:semver-minor']
      - dependency-name: riverpod
        update-types: ['version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      actions:
        patterns:
          - '*'
